# Academic paper optimized plotting configuration
font:
  family: 'Times New Roman'
  size: 10  # 论文中通常使用较小字体

axes:
  labelsize: 10   # 坐标轴标签
  titlesize: 11   # 图表标题，略大于正文
  linewidth: 0.8  # 更细的坐标轴线

ticks:
  labelsize: 9    # 刻度标签，比坐标轴标签小

legend:
  fontsize: 9     # 图例字体
  frameon: true   # 显示图例边框
  fancybox: false # 简单边框
  shadow: false   # 无阴影
  framealpha: 1.0 # 完全不透明背景
  edgecolor: 'black'  # 黑色边框
  facecolor: 'white'  # 白色背景

figure:
  titlesize: 12   # 整体图标题
  dpi: 300
  figsize: [6, 4] # 论文中常用的宽高比

lines:
  linewidth: 1.2  # 适中的线宽，确保打印清晰
  markersize: 3   # 较小的标记点

grid:
  alpha: 0.0      # 无网格

mathtext:
  fontset: 'stix'  # 与Times New Roman匹配的数学字体

savefig:
  dpi: 300
  bbox: 'tight'
  format: 'pdf'
  pad_inches: 0.1  # 适当的边距

# 学术论文友好的颜色方案
academic_colors:
  # 使用色盲友好且打印友好的颜色
  red: '#CC0000'      # 深红色，打印效果好
  blue: '#0066CC'     # 深蓝色
  green: '#009900'    # 深绿色
  orange: '#FF6600'   # 橙色
  purple: '#6600CC'   # 紫色
  black: '#000000'    # 黑色
  gray: '#666666'     # 灰色

# Color configuration for single trajectory
colors:
  velocity: '#0066CC'     # 深蓝色
  acceleration: '#FF6600' # 橙色
  jerk: '#009900'         # 深绿色
  orientation: '#CC0000'  # 深红色
  steering: '#6600CC'     # 紫色

# Line style configuration for single trajectory
linestyles:
  velocity: '-'
  acceleration: '-'
  jerk: '-'
  orientation: '-'
  steering: '-'

# Dual trajectory configuration - 学术论文优化
dual_trajectories:
  trajectory1:
    colors:
      velocity: '#CC0000'     # 深红色 - 更适合论文打印
      acceleration: '#CC0000'
      jerk: '#CC0000'
      orientation: '#CC0000'
      steering: '#CC0000'
      position: '#CC0000'
    linestyles:
      velocity: '-'           # 实线
      acceleration: '-'
      jerk: '-'
      orientation: '-'
      steering: '-'
      position: '-'
    markers:
      velocity: 'None'
      acceleration: 'None'
      jerk: 'None'
      orientation: 'None'
      steering: 'None'
      position: 'o'           # 圆形标记
    alpha: 1.0              # 完全不透明，确保打印清晰
    linewidth: 1.2
    markersize: 3

  trajectory2:
    colors:
      velocity: '#0066CC'     # 深蓝色 - 与红色对比度好
      acceleration: '#0066CC'
      jerk: '#0066CC'
      orientation: '#0066CC'
      steering: '#0066CC'
      position: '#0066CC'
    linestyles:
      velocity: '--'          # 虚线，增加区分度
      acceleration: '--'
      jerk: '--'
      orientation: '--'
      steering: '--'
      position: '--'
    markers:
      velocity: 'None'
      acceleration: 'None'
      jerk: 'None'
      orientation: 'None'
      steering: 'None'
      position: 's'           # 方形标记
    alpha: 1.0
    linewidth: 1.2
    markersize: 3

# 学术论文标签
dual_labels:
  default: ['Method A', 'Method B']
  academic_examples:
    - ['Proposed Method', 'Baseline Method']
    - ['Optimized Trajectory', 'Original Trajectory']
    - ['Algorithm 1', 'Algorithm 2']
    - ['With Constraints', 'Without Constraints']
    - ['Reactive Planning', 'Static Planning']

# 论文中常用的图表标题格式
plot_titles:
  academic_style: true
  title_format: "{variable} Comparison"  # 简洁的标题格式

# 坐标轴标签的学术格式
axis_labels:
  time_step: "Time Step"
  velocity: "Velocity (m/s)"
  acceleration: "Acceleration (m/s²)"
  jerk: "Jerk (m/s³)"
  orientation: "Orientation (rad)"
  steering: "Steering Angle (rad)"
  position_x: "x (m)"
  position_y: "y (m)"