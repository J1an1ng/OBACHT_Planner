# Academic paper optimized plotting configuration
font:
  family: 'Times New Roman'
  size: 10  # Papers typically use a smaller font

axes:
  labelsize: 10   # Axis labels
  titlesize: 11   # Plot title, slightly larger than body text
  linewidth: 0.8  # Thin axis lines

ticks:
  labelsize: 9    # Tick labels, smaller than axis labels

legend:
  fontsize: 9     # Legend font
  frameon: true   # Show legend border
  fancybox: false # Simple border
  shadow: false   # No shadow
  framealpha: 1.0 # Fully opaque background
  edgecolor: 'black'  # Black border
  facecolor: 'white'  # White background

figure:
  titlesize: 12   # Figure title
  dpi: 300
  figsize: [6, 4] # Aspect ratio commonly used in papers

lines:
  linewidth: 1.2  # Moderate line width for clear printing
  markersize: 3   # Small markers

grid:
  alpha: 0.0      # No grid

mathtext:
  fontset: 'stix'  # Math font matching Times New Roman

savefig:
  dpi: 300
  bbox: 'tight'
  format: 'pdf'
  pad_inches: 0.1  # Compact padding

# Publication-friendly color palette
academic_colors:
  # Color-blind-accessible and print-friendly colors
  red: '#CC0000'      # Dark red with good print contrast
  blue: '#0066CC'     # Dark blue
  green: '#009900'    # Dark green
  orange: '#FF6600'   # Orange
  purple: '#6600CC'   # Purple
  black: '#000000'    # Black
  gray: '#666666'     # Gray

# Color configuration for single trajectory
colors:
  velocity: '#0066CC'     # Dark blue
  acceleration: '#FF6600' # Orange
  jerk: '#009900'         # Dark green
  orientation: '#CC0000'  # Dark red
  steering: '#6600CC'     # Purple

# Line style configuration for single trajectory
linestyles:
  velocity: '-'
  acceleration: '-'
  jerk: '-'
  orientation: '-'
  steering: '-'

# Dual-trajectory configuration optimized for publications
dual_trajectories:
  trajectory1:
    colors:
      velocity: '#CC0000'     # Dark red for good print contrast
      acceleration: '#CC0000'
      jerk: '#CC0000'
      orientation: '#CC0000'
      steering: '#CC0000'
      position: '#CC0000'
    linestyles:
      velocity: '-'           # Solid line
      acceleration: '-'
      jerk: '-'
      orientation: '-'
      steering: '-'
      position: '-'
    markers:
      velocity: 'None'
      acceleration: 'None'
      jerk: 'None'
      orientation: 'None'
      steering: 'None'
      position: 'o'           # Circle marker
    alpha: 1.0              # Fully opaque for clear printing
    linewidth: 1.2
    markersize: 3

  trajectory2:
    colors:
      velocity: '#0066CC'     # Dark blue with good contrast against red
      acceleration: '#0066CC'
      jerk: '#0066CC'
      orientation: '#0066CC'
      steering: '#0066CC'
      position: '#0066CC'
    linestyles:
      velocity: '--'          # Dashed line for stronger differentiation
      acceleration: '--'
      jerk: '--'
      orientation: '--'
      steering: '--'
      position: '--'
    markers:
      velocity: 'None'
      acceleration: 'None'
      jerk: 'None'
      orientation: 'None'
      steering: 'None'
      position: 's'           # Square marker
    alpha: 1.0
    linewidth: 1.2
    markersize: 3

# Publication labels
dual_labels:
  default: ['Method A', 'Method B']
  academic_examples:
    - ['Proposed Method', 'Baseline Method']
    - ['Optimized Trajectory', 'Original Trajectory']
    - ['Algorithm 1', 'Algorithm 2']
    - ['With Constraints', 'Without Constraints']
    - ['Reactive Planning', 'Static Planning']

# Plot-title format commonly used in papers
plot_titles:
  academic_style: true
  title_format: "{variable} Comparison"  # Concise title format

# Publication-style axis labels
axis_labels:
  time_step: "Time Step"
  velocity: "Velocity (m/s)"
  acceleration: "Acceleration (m/s²)"
  jerk: "Jerk (m/s³)"
  orientation: "Orientation (rad)"
  steering: "Steering Angle (rad)"
  position_x: "x (m)"
  position_y: "y (m)"
