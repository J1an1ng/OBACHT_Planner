
planning:
  dt: 0.1
  replanning_frequency: 5
  time_steps_computation: 50
  low_vel_mode_threshold : 0.3


vehicle:
  # CR vehicle type (see commonroad-vehicle-models): #1: Ford Escort, #2: BMW 320i, 3 = VW Vanagon
  id_type_vehicle: 2
  a_max: 5.0

debug:
  show_plots: true
  save_plots: false
  draw_traj_set: false
  draw_icons: true
  multiproc: False
  num_workers: 6
  logging_level: DEBUG

sampling:
  t_min: 0.2
  longitudinal_mode: velocity_keeping
  v_max: 5.0
  v_min: 0.0
  d_min: -3.0  #3
  d_max: 3.0
  desire_velocity: 2.5
  num_sampling_levels: 5

sumo:
  sumo_planning_steps: 5
